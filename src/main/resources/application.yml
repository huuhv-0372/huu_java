spring:
  application:
    name: foodsndrinks
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # Change to 'prod' when deploying to a real server
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:be50adf0f8a094}
    password: ${MAIL_PASSWORD:fba584c9dc631c}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Social login (see login.html "Đăng nhập bằng..." buttons). Client id/secret come from each
  # provider's developer console — set the real values via env vars before going live; the
  # "changeme-*" defaults just let the app boot without them configured.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:512528754291-re02acdrerinr47adao4mu1hjrclgbl0.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope: openid, profile, email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:changeme-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:changeme-facebook-client-secret}
            scope: public_profile, email
          twitter:
            client-id: ${TWITTER_CLIENT_ID:changeme-twitter-client-id}
            client-secret: ${TWITTER_CLIENT_SECRET:changeme-twitter-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_basic
            scope: users.read, tweet.read
        provider:
          google:
            # Google verifies email ownership, so use it as the account-matching / principal name key
            user-name-attribute: email
          facebook:
            # Spring's Facebook default only requests id,name,email — add the profile picture too
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
          twitter:
            # Twitter/X isn't one of Spring's built-in providers (CommonOAuth2Provider) — fully manual.
            # Its OAuth2 authorization server also mandates PKCE regardless of client type (see
            # SecurityConfig#pkceAuthorizationRequestResolver).
            authorization-uri: https://twitter.com/i/oauth2/authorize
            token-uri: https://api.twitter.com/2/oauth2/token
            # user.fields=profile_image_url so the response includes an avatar URL
            user-info-uri: https://api.twitter.com/2/users/me?user.fields=profile_image_url
            # The response nests every field under a top-level "data" object — see
            # CustomOAuth2UserService, which unwraps it. "data" itself is just used to satisfy
            # DefaultOAuth2UserService's "name attribute must exist" check.
            user-name-attribute: data

server:
  port: 8080 # Default port

app:
  notification:
    admin-email: ${ADMIN_NOTIFY_EMAIL:admin@example.com}
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/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}
      enabled: ${SLACK_NOTIFY_ENABLED:true}
    mail:
      enabled: ${MAIL_NOTIFY_ENABLED:true}
      from: ${MAIL_FROM:no-reply@foodsndrinks.local}
    statistics:
      cron: ${ORDER_STATS_CRON:0 0 23 L * *} # 23h ngày cuối tháng
      zone: Asia/Ho_Chi_Minh
